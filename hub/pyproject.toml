[project]
name = "homemusic-hub"
version = "0.1.0"
description = "HomeMusic Hub: catalog, downloaders, uploads, tagging and AI assistant on top of Navidrome"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.145.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.0",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]==2.1.5",
    "aiosqlite>=0.21.0",
    "alembic==1.20.0",
    "httpx[http2]==0.28.1",
    "selectolax==1.0.1",
    "mutagen==1.48.1",
    "rapidfuzz==3.14.6",
    "pillow==13.0.0",
    "cryptography==50.0.2",
    "python-multipart==0.0.32",
    "yt-dlp==2026.10.26",
    "yt-dlp-ejs==0.8.0",
    "bgutil-ytdlp-pot-provider==2.0.2",
    "yandex-music==3.2.2",
    "openai==3.35.1",
    "sse-starlette>=2.2.1",
    "unidecode>=1.4.0",
    "aiogram>=3.13,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-xdist>=3.8",
    "respx>=0.22",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: hits real external services (set HUB_NETWORK_TESTS=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF", "I", "ASYNC"]
# B008: FastAPI Depends()/File() defaults; RUF001-003: Cyrillic text is intentional
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
